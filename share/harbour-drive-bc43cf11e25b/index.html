<template id="driverGuide">
  <div class="guide-controls">
    <section>
      <h2>駕駛</h2>
      <dl>
        <dt>加速</dt><dd><kbd>W</kbd> 或 <kbd>↑</kbd></dd>
        <dt>煞車，停定後按住倒車</dt><dd><kbd>S</kbd> 或 <kbd>↓</kbd></dd>
        <dt>左轉</dt><dd><kbd>A</kbd> 或 <kbd>←</kbd></dd>
        <dt>右轉</dt><dd><kbd>D</kbd> 或 <kbd>→</kbd></dd>
        <dt>手掣</dt><dd><kbd>空白鍵</kbd></dd>
      </dl>
    </section>
    <section>
      <h2>喇叭、聲音與車燈</h2>
      <dl>
        <dt>按喇叭（響號）</dt><dd><kbd>B</kbd></dd>
        <dt>靜音／恢復聲音</dt><dd><kbd>V</kbd></dd>
        <dt>開燈／關燈</dt><dd><kbd>L</kbd></dd>
        <dt>恢復自動車燈</dt><dd><kbd>Shift</kbd> + <kbd>L</kbd></dd>
      </dl>
    </section>
    <section>
      <h2>視角</h2>
      <dl>
        <dt>切換五個駕駛視角</dt><dd><kbd>C</kbd></dd>
        <dt>駕駛席望左／望右</dt><dd>按住 <kbd>Q</kbd>／<kbd>E</kbd></dd>
        <dt>拉近／拉遠鏡頭</dt><dd><kbd>+</kbd> 或 <kbd>=</kbd>／<kbd>−</kbd></dd>
      </dl>
      <p>左右拖動可轉動視角，滾輪可調整遠近。</p>
    </section>
    <section>
      <h2>地圖與選單</h2>
      <dl>
        <dt>開啟／關閉街區地圖</dt><dd><kbd>M</kbd></dd>
        <dt>暫停／繼續駕駛</dt><dd><kbd>Esc</kbd> 或 <kbd>P</kbd></dd>
        <dt>開啟／關閉操作指南</dt><dd><kbd>H</kbd></dd>
        <dt>選單移到下一項／上一項</dt><dd><kbd>Tab</kbd>／<kbd>Shift</kbd> + <kbd>Tab</kbd></dd>
      </dl>
    </section>
    <section>
      <h2>在地圖上</h2>
      <dl>
        <dt>平移地圖</dt><dd><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd></dd>
        <dt>放大／縮小</dt><dd><kbd>+</kbd> 或 <kbd>=</kbd>／<kbd>−</kbd></dd>
        <dt>定位車輛（選站時顯示全圖）</dt><dd><kbd>Home</kbd></dd>
      </dl>
      <p>拖動可平移，滾輪或雙指可縮放。雙擊放大，按住 <kbd>Shift</kbd> 雙擊縮小。</p>
    </section>
    <section>
      <h2>搜尋地點</h2>
      <dl>
        <dt>選上一個／下一個搜尋結果</dt><dd><kbd>↑</kbd>／<kbd>↓</kbd></dd>
        <dt>選取地點</dt><dd><kbd>Enter</kbd></dd>
        <dt>收起搜尋結果</dt><dd><kbd>Esc</kbd></dd>
      </dl>
    </section>
  </div>
  <!-- Local explorer controls -->
  <ol class="guide-tips">
    <li>在地圖選「的士站」，駛入標示 <b>TAXI</b> 的候客位停定。</li>
    <li>遊戲內每天早上 <b>6 點</b>會自動扣除 <b>HK$50</b> 的士日租。</li>
  </ol>
</template>
