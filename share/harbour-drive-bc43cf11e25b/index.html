<template id="driverGuide">
  <div class="guide-controls">
    <section>
      <h2>駕駛</h2>
      <dl>
        <dt>加速</dt><dd><kbd>W</kbd> 或 <kbd>↑</kbd></dd>
        <dt>煞車，停定後按住倒車</dt><dd><kbd>S</kbd> 或 <kbd>↓</kbd></dd>
        <dt>左轉</dt><dd><kbd>A</kbd> 或 <kbd>←</kbd></dd>
        <dt>右轉</dt><dd><kbd>D</kbd> 或 <kbd>→</kbd></dd>
        <dt>手掣</dt><dd><kbd>空白鍵</kbd></dd>
      </dl>
    </section>
    <section>
      <h2>喇叭、聲音與車燈</h2>
      <dl>
        <dt>按喇叭（響號）</dt><dd><kbd>B</kbd></dd>
        <dt>靜音／恢復聲音</dt><dd><kbd>V</kbd></dd>
        <dt>開燈／關燈</dt><dd><kbd>L</kbd></dd>
        <dt>恢復自動車燈</dt><dd><kbd>Shift</kbd> + <kbd>L</kbd></dd>
      </dl>
    </section>
    <section>
      <h2>視角</h2>
      <dl>
        <dt>切換五個駕駛視角</dt><dd><kbd>C</kbd></dd>
        <dt>駕駛席望左／望右</dt><dd>按住 <kbd>Q</kbd>／<kbd>E</kbd></dd>
        <dt>拉近／拉遠鏡頭</dt><dd><kbd>+</kbd> 或 <kbd>=</kbd>／<kbd>−</kbd></dd>
      </dl>
      <p>左右拖動可轉動視角，滾輪可調整遠近。</p>
    </section>
    <section>
      <h2>地圖與選單</h2>
      <dl>
        <dt>開啟／關閉街區地圖</dt><dd><kbd>M</kbd></dd>
        <dt>暫停／繼續駕駛</dt><dd><kbd>Esc</kbd> 或 <kbd>P</kbd></dd>
        <dt>開啟／關閉操作指南</dt><dd><kbd>H</kbd></dd>
        <dt>選單移到下一項／上一項</dt><dd><kbd>Tab</kbd>／<kbd>Shift</kbd> + <kbd>Tab</kbd></dd>
      </dl>
    </section>
    <section>
      <h2>在地圖上</h2>
      <dl>
        <dt>平移地圖</dt><dd><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd></dd>
        <dt>放大／縮小</dt><dd><kbd>+</kbd> 或 <kbd>=</kbd>／<kbd>−</kbd></dd>
        <dt>定位車輛（選站時顯示全圖）</dt><dd><kbd>Home</kbd></dd>
      </dl>
      <p>拖動可平移，滾輪或雙指可縮放。雙擊放大，按住 <kbd>Shift</kbd> 雙擊縮小。</p>
    </section>
    <section>
      <h2>搜尋地點</h2>
      <dl>
        <dt>選上一個／下一個搜尋結果</dt><dd><kbd>↑</kbd>／<kbd>↓</kbd></dd>
        <dt>選取地點</dt><dd><kbd>Enter</kbd></dd>
        <dt>收起搜尋結果</dt><dd><kbd>Esc</kbd></dd>
      </dl>
    </section>
  </div>
  <!-- Local explorer controls -->
  <ol class="guide-tips">
    <li>在地圖選「的士站」後，右上方會顯示行車距離。途中可關閉指引，或跟隨導航駛入 <b>TAXI</b> 候客位。</li>
    <li>在 TAXI 位停定後，選「開始候客」便會開始等單，畫面會顯示已等候及預計時間。也可選擇休息 8 小時或換車。駛離候客位會取消候客。</li>
    <li>暫停選單的<b>車庫</b>可隨時查看車款。換車須空車停在的士站，站外可從車庫開啟地圖找站。每天早上 <b>6 點</b>恢復一次換車機會，並按剛結束的租車日內用過的最高日租扣款。Crown Comfort 為 HK$50，Comfort Hybrid 為 HK$65。</li>
    <li>駕駛 Comfort Hybrid 可在的士站接載攜帶大件行李的乘客。送達時每件行李另收 HK$6，與跳錶車資分開計算。</li>
  </ol>
  <details>
    <summary>本次更新（11 月 28 日）</summary>
    <ul>
      <li>候客由你決定。停定後可選「開始候客」、休息 8 小時或換車。開始候客後，頭 5 秒也有機會接到乘客。</li>
      <li>載客途中也可逛車庫。空車時選好車款，地圖會指引你前往的士站換車。</li>
      <li>日租扣款更清楚。早上 6 點會顯示車款和金額，暫停選單也可翻查上次扣租。已修正高租金跨日沿用的問題。</li>
      <li>修整啟德隧道的分叉和出入口，補平長沙灣大埔道近郝德傑道一段的路面和山坡。</li>
      <li>出車時優先載入附近街景，導航會提前準備彎後的街道，減少轉彎時的停頓。</li>
    </ul>
  </details>
  <details>
    <summary>上次地圖及車庫更新（11 月 26 日）</summary>
    <ul>
      <li>更大的地圖。新增深水埗、石硤尾、又一村、大窩坪和長沙灣，的士站由 52 個增至 59 個。</li>
      <li>新增車庫和 Comfort Hybrid。可比較兩款車的加速和煞停表現，混能的士每件大件行李可多收 HK$6。</li>
      <li>更熱鬧的街景。舊區有彩色招牌和不同款式的店舖，街上多了城巴、城巴站牌和港鐵標誌。</li>
      <li>更清楚的任務提示。可查看候客時間和剩餘車程，也可在的士站休息 8 小時。</li>
      <li>更順暢的行車。改善路口綠燈塞車、窄路迎頭堵塞和橋底誤上橋面的問題。</li>
      <li>更快進入主選單。部分街景改為開車後按需要載入。</li>
      <li>更低的罰款。衝紅燈或車資超出參考上限時，若被罰款，每次 HK$50。</li>
    </ul>
  </details>
</template>
